<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Commandos Browser Lock</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="popup-container">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <span class="logo">⚡</span>
                <span class="title">Code Commandos</span>
            </div>
            <span id="connectionBadge" class="status-badge connecting">Connecting...</span>
        </div>

        <!-- Main Info Card -->
        <div class="card">
            <div class="device-info">
                <span class="label font-mono">DEVICE ID</span>
                <div class="device-row">
                    <span id="deviceIdText" class="device-id">dev_loading</span>
                    <button id="copyIdBtn" title="Copy Device ID">📋</button>
                </div>
            </div>

            <div class="device-name-row">
                <label for="deviceNameInput">Device Name:</label>
                <input type="text" id="deviceNameInput" placeholder="Workstation Name">
            </div>
        </div>

        <!-- Action Button -->
        <button id="lockNowBtn" class="lock-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0110 0v4"></path>
            </svg>
            Lock Browser Now
        </button>

        <!-- Hub Settings Accordion -->
        <div class="settings-section">
            <button id="toggleSettingsBtn" class="settings-toggle">
                <span>⚙️ Hub Connection Config</span>
                <span id="arrowIcon">▼</span>
            </button>
            <div id="settingsBox" class="settings-box hidden">
                <label for="hubUrlInput">Hub Server API URL:</label>
                <input type="text" id="hubUrlInput" placeholder="http://localhost:3000">
                
                <label for="devicePasswordInput">Unlock PIN / Password:</label>
                <input type="text" id="devicePasswordInput" placeholder="1234">

                <button id="saveConfigBtn" class="save-config-btn">Save Settings</button>
                <p id="configMsg" class="msg"></p>
            </div>
        </div>

        <div class="footer">
            <span>Remote control active via Admin Panel</span>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="popup.js"></script>
</body>
</html>
